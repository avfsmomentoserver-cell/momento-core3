# Grafana Dashboards Configuration for Momento Core V5
# V5 Specification: System, application, and business dashboards

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: momento-v5
  labels:
    app: grafana
    version: v5
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
    - name: 'Momento Core Dashboards'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards
