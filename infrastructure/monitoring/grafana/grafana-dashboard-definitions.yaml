# Grafana Dashboard Definitions for Momento Core V5
# V5 Specification: System, application, and business dashboards

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-definitions
  namespace: momento-v5
  labels:
    app: grafana
    version: v5
data:
  system-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Momento Core - System Overview",
        "tags": ["momento", "system", "v5"],
        "timezone": "browser",
        "refresh": "30s",
        "panels": [
          {
            "id": 1,
            "title": "Cluster CPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) by (instance))",
                "legendFormat": "{{instance}}"
              }
            ],
            "yaxes": [
              {"format": "percent", "label": "CPU"},
              {"format": "short"}
            ]
          },
          {
            "id": 2,
            "title": "Cluster Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
                "legendFormat": "{{instance}}"
              }
            ],
            "yaxes": [
              {"format": "percent", "label": "Memory"},
              {"format": "short"}
            ]
          },
          {
            "id": 3,
            "title": "Disk Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "(1 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})) * 100",
                "legendFormat": "{{instance}}"
              }
            ],
            "yaxes": [
              {"format": "percent", "label": "Disk"},
              {"format": "short"}
            ]
          },
          {
            "id": 4,
            "title": "Network Traffic",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(node_network_receive_bytes_total[5m])",
                "legendFormat": "{{instance}} - RX"
              },
              {
                "expr": "rate(node_network_transmit_bytes_total[5m])",
                "legendFormat": "{{instance}} - TX"
              }
            ],
            "yaxes": [
              {"format": "Bps", "label": "Traffic"},
              {"format": "short"}
            ]
          },
          {
            "id": 5,
            "title": "Pod Status",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(kube_pod_status_ready{condition=\"true\"})",
                "legendFormat": "Ready"
              },
              {
                "expr": "sum(kube_pod_status_ready{condition=\"false\"})",
                "legendFormat": "Not Ready"
              }
            ]
          },
          {
            "id": 6,
            "title": "Node Status",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=\"kubernetes-nodes\"}",
                "legendFormat": "Up"
              }
            ]
          }
        ]
      }
    }
  application-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Momento Core - Application Overview",
        "tags": ["momento", "application", "v5"],
        "timezone": "browser",
        "refresh": "15s",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])",
                "legendFormat": "{{app}}"
              }
            ],
            "yaxes": [
              {"format": "reqps", "label": "Requests/sec"},
              {"format": "short"}
            ]
          },
          {
            "id": 2,
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total{status=~\"5..\"}[5m])",
                "legendFormat": "{{app}}"
              }
            ],
            "yaxes": [
              {"format": "reqps", "label": "Errors/sec"},
              {"format": "short"}
            ]
          },
          {
            "id": 3,
            "title": "P95 Latency",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "{{app}}"
              }
            ],
            "yaxes": [
              {"format": "s", "label": "Latency"},
              {"format": "short"}
            ]
          },
          {
            "id": 4,
            "title": "Backend Service Status",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=\"momento-backend\"}",
                "legendFormat": "Backend"
              }
            ]
          },
          {
            "id": 5,
            "title": "Frontend Service Status",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=\"momento-frontend\"}",
                "legendFormat": "Frontend"
              }
            ]
          },
          {
            "id": 6,
            "title": "Active Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "http_active_connections",
                "legendFormat": "{{app}}"
              }
            ]
          }
        ]
      }
    }
  database-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Momento Core - Database Overview",
        "tags": ["momento", "database", "v5"],
        "timezone": "browser",
        "refresh": "30s",
        "panels": [
          {
            "id": 1,
            "title": "PostgreSQL Connection Pool",
            "type": "graph",
            "targets": [
              {
                "expr": "pg_stat_activity_count",
                "legendFormat": "Active Connections"
              },
              {
                "expr": "pg_settings_max_connections",
                "legendFormat": "Max Connections"
              }
            ]
          },
          {
            "id": 2,
            "title": "PostgreSQL Query Duration",
            "type": "graph",
            "targets": [
              {
                "expr": "pg_stat_statements_mean_exec_time",
                "legendFormat": "Mean Query Time"
              }
            ]
          },
          {
            "id": 3,
            "title": "Redis Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "redis_memory_used_bytes / redis_memory_max_bytes * 100",
                "legendFormat": "Memory Usage %"
              }
            ],
            "yaxes": [
              {"format": "percent", "label": "Memory"},
              {"format": "short"}
            ]
          },
          {
            "id": 4,
            "title": "Redis Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "redis_connected_clients",
                "legendFormat": "Connected Clients"
              }
            ]
          },
          {
            "id": 5,
            "title": "Cache Hit Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "redis_keyspace_hits / (redis_keyspace_hits + redis_keyspace_misses) * 100",
                "legendFormat": "Hit Rate %"
              }
            ],
            "yaxes": [
              {"format": "percent", "label": "Hit Rate"},
              {"format": "short"}
            ]
          }
        ]
      }
    }
