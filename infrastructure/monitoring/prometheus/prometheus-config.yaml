# Prometheus Configuration for Momento Core V5
# V5 Specification: Prometheus 2.47+, 30-day retention, 15s scrape interval

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: momento-v5
  labels:
    app: prometheus
    version: v5
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
      external_labels:
        cluster: 'momento-v5'
        environment: 'production'
        monitor: 'momento-monitoring'

    # Alertmanager configuration
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093
        timeout: 10s
        api_version: v2

    # Rule files
    rule_files:
      - '/etc/prometheus/rules/*.yml'
      - '/etc/prometheus/rules/*.yaml'

    # Scrape configurations
    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
        - targets: ['localhost:9090']
        relabel_configs:
        - source_labels: [__address__]
          target_label: instance
          replacement: 'prometheus'

      # Kubernetes API Server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_namespace]
          target_label: namespace

      # Kubernetes Nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics

      # Kubernetes Pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: pod

      # Momento Backend
      - job_name: 'momento-backend'
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - momento-v5
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: momento-backend
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_namespace]
          target_label: namespace
        - source_labels: [__address__]
          target_label: __address__
          regex: (.*):(\d+)
          replacement: ${1}:9090

      # Momento Frontend
      - job_name: 'momento-frontend'
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - momento-v5
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: momento-frontend
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_namespace]
          target_label: namespace

      # PostgreSQL
      - job_name: 'postgres'
        static_configs:
        - targets: ['postgres-exporter:9187']
        relabel_configs:
        - source_labels: [__address__]
          target_label: instance
          replacement: 'postgres'

      # Redis
      - job_name: 'redis'
        static_configs:
        - targets: ['redis-exporter:9121']
        relabel_configs:
        - source_labels: [__address__]
          target_label: instance
          replacement: 'redis'

      # Istio Mesh
      - job_name: 'istio-mesh'
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - istio-system
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: istiod
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_namespace]
          target_label: namespace
        - source_labels: [__address__]
          target_label: __address__
          regex: (.*):(\d+)
          replacement: ${1}:15014

      # Node Exporter
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: node-exporter
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_namespace]
          target_label: namespace

      # Kube State Metrics
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: kube-state-metrics
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_namespace]
          target_label: namespace
