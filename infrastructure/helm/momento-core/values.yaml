# Default values for Momento Core V5
# V5 Specification: Configurable values for deployment

global:
  environment: production
  domain: momento.local
  replicas: 3

image:
  backend:
    repository: ghcr.io/momento-core/momento-backend
    tag: latest
    pullPolicy: Always
  frontend:
    repository: ghcr.io/momento-core/momento-frontend
    tag: latest
    pullPolicy: Always

# Backend configuration
backend:
  enabled: true
  replicas: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    APP_ENV: production
    LOG_LEVEL: info
  service:
    type: ClusterIP
    port: 80
    metricsPort: 9090

# Frontend configuration
frontend:
  enabled: true
  replicas: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  service:
    type: ClusterIP
    port: 80

# PostgreSQL configuration
postgres:
  enabled: true
  replicas: 1
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  persistence:
    enabled: true
    size: 100Gi
    storageClass: fast-ssd
  config:
    sharedBuffers: 4GB
    effectiveCacheSize: 12GB
    maintenanceWorkMem: 1GB
    maxConnections: 200
  service:
    type: ClusterIP
    port: 5432

# Redis configuration
redis:
  enabled: true
  replicas: 1
  image:
    repository: redis
    tag: "7.2"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: fast-ssd
  config:
    maxmemory: 2gb
    maxmemoryPolicy: allkeys-lru
  service:
    type: ClusterIP
    port: 6379

# Istio configuration
istio:
  enabled: true
  gateway:
    enabled: true
    type: LoadBalancer
  virtualService:
    enabled: true
  destinationRule:
    enabled: true
  authorizationPolicy:
    enabled: true

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  grafana:
    enabled: true
    dashboard:
      enabled: true

# Network policies
networkPolicy:
  enabled: true
  defaultDeny: true

# Pod disruption budgets
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Vertical Pod Autoscaler
vpa:
  enabled: true
  updateMode: "Off"

# Security
security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

# Service account
serviceAccount:
  create: true
  annotations: {}

# Ingress
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: momento.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resource quotas
resourceQuota:
  enabled: true
  requests:
    cpu: "10"
    memory: "20Gi"
  limits:
    cpu: "20"
    memory: "40Gi"

# Pod security policy
podSecurityPolicy:
  enabled: true
