# Prometheus Configuration for V5 Free-Tier
# Local monitoring configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'momento-v5-free-tier'
    environment: 'local'

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
    - targets: ['localhost:9090']

  # PostgreSQL monitoring
  - job_name: 'postgres'
    static_configs:
    - targets: ['postgres:5432']
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
    - targets: ['redis:6379']
    metrics_path: /metrics
    scrape_interval: 30s

  # Momento Backend API
  - job_name: 'momento-backend'
    static_configs:
    - targets: ['host.docker.internal:8000']
    metrics_path: /metrics
    scrape_interval: 15s

  # Momento Frontend
  - job_name: 'momento-frontend'
    static_configs:
    - targets: ['host.docker.internal:5173']
    metrics_path: /metrics
    scrape_interval: 30s

  # Kubernetes pods (if using Kind)
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
    - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
      action: keep
      regex: true
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
      action: replace
      target_label: __metrics_path__
      regex: (.+)
    - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
      action: replace
      regex: ([^:]+)(?::\d+)?;(\d+)
      replacement: $1:$2
      target_label: __address__