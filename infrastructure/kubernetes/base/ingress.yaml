apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: momento-ingress
  namespace: momento-v5
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst: "200"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.momento-v5.com
    - app.momento-v5.com
    secretName: momento-tls-secret
  rules:
  - host: api.momento-v5.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: momento-backend-service
            port:
              number: 80
  - host: app.momento-v5.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: momento-frontend-service
            port:
              number: 80
