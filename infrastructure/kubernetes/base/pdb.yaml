# Pod Disruption Budget Configuration for Momento Core V5
# V5 Specification: PDB for high availability during maintenance

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: momento-backend-pdb
  namespace: momento-v5
  labels:
    app: momento-backend
    version: v5
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: momento-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
