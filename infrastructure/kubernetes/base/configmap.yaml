apiVersion: v1
kind: ConfigMap
metadata:
  name: momento-config
  namespace: momento-v5
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  
  # Database Configuration
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "momento_v5"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # Performance Configuration
  UVICORN_WORKERS: "4"
  UVICORN_TIMEOUT: "300"
  MAX_CONNECTIONS: "100"
  
  # Monitoring Configuration
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PORT: "9090"
  GRAFANA_ENABLED: "true"
  
  # Security Configuration
  TLS_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  WAF_ENABLED: "true"
